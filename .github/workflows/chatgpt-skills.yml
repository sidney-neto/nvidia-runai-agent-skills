name: ChatGPT skill packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - run: make check
      - name: Build and verify packages
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
            args=(--version "$REF_NAME")
          fi
          python scripts/package_chatgpt_skills.py --all --validate-only
          python scripts/package_chatgpt_skills.py --all --output dist/chatgpt "${args[@]}"
          python scripts/validate_chatgpt_skill.py --release dist/chatgpt/release --json
          (cd dist/chatgpt/release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatgpt-skills
          path: dist/chatgpt/
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chatgpt-skills
          path: dist/chatgpt
      - name: Attach validated assets to an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          (cd dist/chatgpt/release && sha256sum --check SHA256SUMS)
          cat > release-notes.md <<'EOF'
          Individual NVIDIA Run:ai Agent Skills packages. Download one `nvidia-runai-*.zip`, verify it against `SHA256SUMS`, then upload through ChatGPT Plugins > Skills > Create > Upload from your computer when available. Do not upload the multi-skill Actions artifact.

          Attach installed skills in Workspace Agent Builder and test with sanitized offline evidence in Preview. Packaging validation is not a ChatGPT import or agent execution test. Installation grants no Kubernetes, Run:ai or MCP access.

          English: https://github.com/sidney-neto/nvidia-runai-agent-skills/blob/main/docs/chatgpt-workspace-agents.md
          Português: https://github.com/sidney-neto/nvidia-runai-agent-skills/blob/main/docs/chatgpt-workspace-agents.pt-BR.md
          EOF
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/chatgpt/release/* --clobber
